name: release

# Push a tag like v0.1.0. The workflow builds the plugin zip, attests its build provenance and
# creates a DRAFT release: the notes are reviewed and the release published by hand.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create the draft release
      id-token: write      # sign the provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: tag matches the plugin version
        run: |
          version="$(sed -n "s/^ *version = (\([0-9]*\), *\([0-9]*\), *\([0-9]*\)).*/\1.\2.\3/p" plugin/__init__.py)"
          test "v${version}" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != plugin version ${version}"; exit 1; }
      - name: build
        id: build
        # An assignment, not `echo "zip=$(...)"`: a failing build must fail this step.
        run: |
          zip="$(scripts/build.sh)"
          echo "zip=${zip}" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.build.outputs.zip }}
      - name: draft release
        env:
          GH_TOKEN: ${{ github.token }}
          ZIP: ${{ steps.build.outputs.zip }}
        run: |
          gh release create "${GITHUB_REF_NAME}" "${ZIP}" --draft --title "${GITHUB_REF_NAME}" \
            --notes "Draft. Write the notes from CHANGELOG.md, then publish."
